<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>प्रोफ़ाइल | NEWSVERSE</title><meta name="theme-color" content="#0F4C81">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/news.css"><link rel="stylesheet" href="css/auth.css"></head>
<body data-page="profile"><main class="auth"><h1>मेरी प्रोफ़ाइल</h1>
<form id="pf" novalidate><label>पूरा नाम<input name="full_name" autocomplete="name" required></label>
<label>ईमेल (बदला नहीं जा सकता)<input name="email" type="email" disabled></label>
<label>उम्र<input name="age" type="number" min="5" max="120" inputmode="numeric" required></label>
<label>मोबाइल नंबर<input name="mobile" type="tel" inputmode="numeric" maxlength="10" required></label>
<p id="msg" class="msg" role="alert"></p><button class="go" type="submit">सेव करें</button></form>
<p class="alt"><a href="dashboard.html">← मेरा खाता</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script><script src="js/app.js"></script><script src="js/auth.js"></script><script src="js/site.js"></script><script src="js/news.js"></script><script src="js/layout.js"></script><script src="js/profile.js"></script></body></html>
