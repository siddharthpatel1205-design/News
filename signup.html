<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>खाता बनाएँ | NEWSVERSE</title><meta name="theme-color" content="#0F4C81">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/auth.css"></head>
<body><header class="top"><a class="brand" href="index.html"><span class="brand-mark">N</span>न्यूज़वर्स</a></header>
<main class="auth"><h1>खाता बनाएँ</h1><p class="muted">7 दिन का मुफ़्त ट्रायल अगले पेज पर शुरू कर सकते हैं।</p>
<form id="signupForm" novalidate>
<label>पूरा नाम<input name="full_name" autocomplete="name" required></label>
<label>ईमेल<input name="email" type="email" autocomplete="username" inputmode="email" required></label>
<label>उम्र<input name="age" type="number" min="5" max="120" inputmode="numeric" required></label>
<label>मोबाइल नंबर<input name="mobile" type="tel" autocomplete="tel-national" inputmode="numeric" maxlength="10" required><span class="hint">10 अंक, बिना +91 के</span></label>
<label>पासवर्ड<input name="password" type="password" autocomplete="new-password" minlength="8" required><span class="hint">कम से कम 8 अक्षर</span></label>
<label>पासवर्ड दोबारा लिखें<input name="confirm" type="password" autocomplete="new-password" required></label>
<p id="msg" class="msg" role="alert"></p>
<button class="go" type="submit">खाता बनाएँ</button></form>
<p class="alt">पहले से खाता है? <a href="login.html">लॉगिन करें</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/site.js"></script></body></html>
