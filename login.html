<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<body><header class="top"><a class="brand" href="index.html"><span class="brand-mark">N</span>न्यूज़वर्स</a></header>
<main class="auth"><h1>लॉगिन</h1><p class="muted">अपने खाते में वापस आएँ।</p>
<form id="loginForm" novalidate>

<label>पासवर्ड<input name="password" type="password" autocomplete="current-password" required></label>
<p id="msg" class="msg" role="alert"></p>
<button class="go" type="submit">लॉगिन करें</button></form>
<p class="alt">नया खाता चाहिए? <a href="signup.html">खाता बनाएँ</a></p></main>
